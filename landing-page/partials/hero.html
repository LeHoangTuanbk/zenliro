<section

>
  <div class="hero-glow"></div>

  <!-- Nav -->

  >
    <a href="/" class="flex items-center gap-2 text-xl sm:text-2xl font-bold tracking-tight">
      <img
        src="./assets/app-icon-64.png"
        srcset="./assets/app-icon-64.png 64w, ./assets/app-icon-128.png 128w"
        sizes="32px"
        width="32"
        height="32"
        alt=""
        class="h-7 w-7 shrink-0 sm:h-8 sm:w-8"

        <a
          href="#showcase"
          class="text-base lg:text-lg text-br-muted hover:text-br-text transition-colors"
          >Showcase</a
        >
        <a
          href="#ai-agent"
          class="text-base lg:text-lg text-br-muted hover:text-br-text transition-colors"
          >AI Agent</a
        >
        <a
          href="https://github.com/LeHoangTuanbk/zenliro"

        <a
          href="https://github.com/LeHoangTuanbk/zenliro/stargazers"
          target="_blank"
          rel="noopener"
          title="Stars on GitHub"
          class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[11px] sm:text-xs text-br-muted hover:text-br-text hover:bg-white/10 transition-colors"

          target="_blank"
          rel="noopener"

        >
          <svg
            class="w-3.5 h-3.5 text-green-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"

              stroke-linejoin="round"

            />

        </a>
      </div>

      <!-- Mobile menu button -->
      <button
        id="mobile-menu-btn"
        class="lg:hidden p-2 text-br-muted hover:text-br-text transition-colors"
        aria-label="Menu"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>

    </div>

  <!-- Hero content -->
  <div class="relative z-10 w-full max-w-5xl mx-auto">
    <div class="text-center max-w-3xl mx-auto">
      <div
        class="inline-flex items-center gap-2 px-3 py-1 mb-8 rounded-full border border-white/10 bg-white/5 text-xs text-br-muted"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        Open Source &middot; AGPL-3.0

      <h1 class="text-5xl sm:text-7xl font-bold tracking-tight leading-[1.1] mb-6">
        Your photos,<br />
        <span
          class="bg-gradient-to-r from-br-accent to-br-accent-warm bg-clip-text text-transparent"
          >perfected.</span
        >
      </h1>

      <p class="text-lg sm:text-xl text-br-muted max-w-xl mx-auto mb-10 leading-relaxed">
        A desktop photo development app with AI-powered editing. Color grading, tone mapping, and
        mood — built for photographers.
      </p>

      <div class="flex items-center justify-center gap-4">
        <a
          href="https://github.com/LeHoangTuanbk/zenliro/releases"

            fill="none"
            viewBox="0 0 24 24"

            />
          </svg>

        <span class="h-px w-8 sm:w-16 bg-gradient-to-r from-transparent to-br-accent"></span>
        <p class="tagline text-2xl sm:text-[2.5rem] font-bold uppercase whitespace-nowrap">
          Enhance, not alter
        </p>
        <span class="h-px w-8 sm:w-16 bg-gradient-to-l from-transparent to-br-accent-warm"></span>
      </div>
    </div>

    <div class="window-frame mt-12 w-full">
      <div class="window-dots"><span></span><span></span><span></span></div>
      <img
        src="./assets/agent-flow-1024.webp"
        srcset="./assets/agent-flow-1024.webp 1024w, ./assets/agent-flow-2048.webp 2048w"
        sizes="(min-width: 64rem) 1024px, calc(100vw - 2rem)"
        width="1024"
        height="639"
        alt="Zenliro Develop workspace with the AI Agent editing a portrait"
        class="block w-full"
        fetchpriority="high"
      />
    </div>

</section>
