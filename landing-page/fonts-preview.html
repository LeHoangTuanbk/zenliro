<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zenliro wordmark fonts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,560&family=Fraunces:opsz,wght@9..144,500&family=Instrument+Serif&family=Newsreader:opsz,wght@6..72,500&family=Syne:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #0a0a0a;
        color: #929292;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 28px 32px 40px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        padding: 0 8px;
        background: #111;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      img {
        width: 32px;
        height: 32px;
      }
      .name {
        width: 210px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .word {
        font-size: 30px;
        line-height: 1;
        color: #c084fc;
      }
      .instrument {
        font-family: 'Instrument Serif', Georgia, serif;
        font-weight: 400;
      }
      .fraunces {
        font-family: Fraunces, Georgia, serif;
        font-weight: 500;
      }
      .newsreader {
        font-family: Newsreader, Georgia, serif;
        font-weight: 500;
      }
      .syne {
        font-family: Syne, system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .bricolage {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 560;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="row">
        <img src="./assets/app-icon.png" alt="" />
        <div class="name">Instrument Serif</div>
        <div class="word instrument">Zenliro</div>
      </div>
      <div class="row">
        <img src="./assets/app-icon.png" alt="" />
        <div class="name">Fraunces</div>
        <div class="word fraunces">Zenliro</div>
      </div>
      <div class="row">
        <img src="./assets/app-icon.png" alt="" />
        <div class="name">Newsreader</div>
        <div class="word newsreader">Zenliro</div>
      </div>
      <div class="row">
        <img src="./assets/app-icon.png" alt="" />
        <div class="name">Syne</div>
        <div class="word syne">Zenliro</div>
      </div>
      <div class="row">
        <img src="./assets/app-icon.png" alt="" />
        <div class="name">Bricolage Grotesque</div>
        <div class="word bricolage">Zenliro</div>
      </div>
    </main>
  </body>
</html>
